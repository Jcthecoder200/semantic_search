name: Publish to PyPI

# Runs whenever you create a GitHub Release (e.g. tagging v0.1.0).
# That's how you'll trigger a new PyPI release going forward —
# no manual `twine upload` needed once this is set up.
on:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install build tool
        run: python -m pip install --upgrade build
      - name: Build package
        run: python -m build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Must match the "Environment name" you enter on PyPI's Trusted
    # Publisher form, and must exist under your GitHub repo's
    # Settings -> Environments (create one named "pypi").
    environment: pypi
    permissions:
      id-token: write  # required for PyPI Trusted Publishing (OIDC)
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
